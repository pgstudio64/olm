[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olm"
version = "0.4.70"
description = "Office Layout Matching — local tool for matching desk layout patterns to floor plan rooms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "pgstudio64" },
]
keywords = ["office", "layout", "floor-plan", "pattern-matching", "desk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

dependencies = [
    "flask>=3.0",
    "jsonschema>=4.20",
    "numpy>=1.24",
]

[project.optional-dependencies]
ingestion = [
    "opencv-python>=4.8",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/pgstudio64/olm"

[tool.pytest.ini_options]
markers = [
    "slow: tests longs (OCR, ray-cast sur image réelle)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # handled by line-length
    "E701",  # multiple statements on one line (colon) — P2.3 follow-up
    "E702",  # multiple statements on one line (semicolon) — P2.3 follow-up
    "E731",  # lambda assignment — P2.3 follow-up
    "F841",  # local variable assigned but never used — P2.3 follow-up
    "E402",  # module-level import not at top — P2.3 follow-up
]

[tool.setuptools.packages.find]
where = ["."]
include = ["olm*"]
exclude = ["project*", "docs*", "solver_lab*"]
